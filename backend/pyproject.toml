[project]
name = "lemma-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pyarrow>=25.0.0",
    "pydantic-ai-slim[openai]>=1.106,<1.107",
    "pydantic-settings>=2.14.1",
    "pyjwt[crypto]>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.50",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.49.0",
    "websockets>=15.0.1",
    "a2a-sdk[http-server]>=1.0.0",
    "web3>=7.0.0",
    "eth-account>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: real model / network tests (set RUN_LIVE_AGENT=1)",
]
